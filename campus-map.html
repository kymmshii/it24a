<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps </title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

</head>
<style>
    #map {
        height: 500px;
    }
    .popup-image{
       max-width: 200px;
        height: auto;
        object-fit: fill;
    }
    #locations{
        width: 250px;
    }
    .location{
        padding: 10px;
        border-bottom: 10px solid #ddd;
        cursor: pointer;
    }
    .location:hover{
        background-color: #eee;
    }
    .container{
        display: flex;
        gap: 15px;
    }
    #map{
        height: 500px;
        flex: 1;
    }
    .popup.image{
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
    
</style>
<body>
    <h1>Simple Maps</h1>
    <div class="container">
        <div id="locations">
            <h3>Locations</h3>
            <div id ="locations-list"></div>
        </div>

        <h3>Map</h3>
    
    <div id="map"></div>
    </div>
</body>
<script>
   
   
   function initMap(mapDataUrl) {
    const map = L.map('map').setView([8.360, 124.868], 17);

   
    //OpenStreetMap Layer
    const openStreetMap =  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
       maxZoom: 19,
       attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });
    
    //Satellite Layer
    const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 
        {attribution: 'Tiles (c) Esri -, Maxar, Earthstar Geographics, & GIS User Community'
    });
    satellite.addTo(map);  


    //Render pins
     fetch(mapDataUrl)
     .then(response=>response.json())
     .then(data=>{
       
            data.forEach(pin=>{
                 const marker = L.marker([pin.lat,pin.lng]).addTo(map);
                 const image= ` <img src=' ${pin.image}' class ="popup-image">`;
                 marker.bindPopup(`
                ${pin.title} <br> 
                <hr>
                ${image}
                 `);
    //flyto
        const item = document.createElement('div');
        item.className = 'location';
        item.textContent = pin.title;

        document.getElementById('locations-list').appendChild(item);
        item.onclick = () =>{
            map.flyTo([pin.lat,pin.lng], 18);
            marker.openPopup();
        }

        });

     //Layer Control
     const baseMaps = {
        "OpenStreetMap": openStreetMap,
        "Satellite": satellite
   }
   L.control.layers(baseMaps).addTo(map);

   

    });
}
   
initMap('campus-map.json');

//documentEventListener

</script>
</html>
