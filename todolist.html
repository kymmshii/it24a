<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>




<body>
    <h1> To Do List</h1>
    <input type="text" id="taskput" placeholder="Add a task">

    <button onclick="addTask()">Add task</button>
    <ul id="tasklist">Your task go here...</ul>


    <script>

function getTaskText() {
   const input = document.getElementById("taskput");
   const text = input.value.trim();
   console.log("The input value is :" + input.value); // Log the task text to the console 
   return text;
}

function addTask() {
    const taskText = getTaskText();
    if (taskText === "") {
        return;
    }
    addTaskItem(taskText);
    document.getElementById("taskput").value = "";
}


function addTaskItem(taskText) {
    const li = document.createElement("li");
    const taskSpan = document.createElement("span");
    taskSpan.textContent = taskText;
    li.appendChild(taskSpan);
    document.getElementById("tasklist").appendChild(li);

    //call the createDoneButton function to create a "Done" button and append it to the li element
    const doneButton = createDoneButton(li);
    li.appendChild(doneButton);

    //call the createEditButton function to create an "Edit" button and append it to the li element
    const editButton = createEditButton(li, taskSpan);
    li.appendChild(editButton);

    //call the createDeleteButton function to create a "Delete" button and append it to the li element
    const deleteButton = createDeleteButton(li);
    li.appendChild(deleteButton);
}

function createDoneButton(li) {
    const doneButton = document.createElement("button");
    doneButton.textContent = "Done";
    doneButton.onclick = () => {
      console.log(li);
      li.classList.add("done");
      const buttons = li.querySelectorAll("button");

      buttons.forEach(button => {
        button.disabled = true;
      });

      console.log("Task Completed", li.textContent, Date.now());
    };
    return doneButton;
}

function createEditButton(li, taskSpan) {
    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.style.marginLeft = "8px";
    editButton.onclick = () => {
        const currentText = taskSpan.textContent;
        const newText = prompt("Edit task:", currentText);
        if (newText !== null && newText.trim() !== "") {
            taskSpan.textContent = newText.trim();
            alert("Updated Task.");
        } else {
            alert("No Changes Made.");
        }
    };
    return editButton;
}

function createDeleteButton(li) {
    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.style.marginLeft = "8px";
    deleteButton.onclick = () => handleDeleteClick(li);
    return deleteButton;
}

function handleDeleteClick(li) {
    li.remove();
    alert("Task Deleted.");
}

    </script>

</body>

</html>
